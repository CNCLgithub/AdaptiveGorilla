format = "Agent"
version = "1.0"
name = "Fixed Resource"


################################################################################
# Perception
################################################################################

[Perception]
protocol = "HyperFilter"

[Perception.params]
dt = 18 # Time window, ~1.5s
h  = 5  # Number of hyper particles

[Perception.params.pf]
protocol = "AdaptiveParticleFilter"
params = {particles = 10} # Number of inner particles

################################################################################
# Planning
################################################################################

[Planning]
protocol = "CollisionCounter"

[Planning.params]
mat = "Light"  # Color of targets
cooldown = 6   # Cooldown between hits (prevents overcounting)
tick_rate = 1  # How often to evaluate counting (same as perception)
threshold = 60.0

################################################################################
# Attention
################################################################################

[Attention]
protocol = "UniformProtocol"

[Attention.params]
moves = 24 # total number of rejuventation moves

################################################################################
# Memory
################################################################################

[Memory]
protocol = "HyperResampling"

[Memory.params]
tau = 1.0
perception = { "protocol" = "ModuleRef", "params" = { "ref" = "Perception" } }

[Memory.params.fitness]
protocol = "MLLFitness"

[Memory.params.kernel]
protocol = "StaticRKernel"
